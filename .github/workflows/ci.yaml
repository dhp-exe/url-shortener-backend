name: CI/CD Pipeline

on:
  push:
    branches: 
      - feature/dohuuphuoc2303@gmail.com

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Test Docker build
        run: docker build -t url-shortener-backend-test .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}